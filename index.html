<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0" /> -->
    <title>Europe Map</title>
    <link rel="icon" type="image/png" href="assets/euromap.png">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
    <script src="countries.js"></script>
</head>

<body>
    <div id="app">
        <div class="header">
            <h1>🗺️ Europe Map</h1>
            <p style="color: #d5c1e9">Choose criteria</p>
            <div class="criteria-controls">
                <div class="switch-container">
                    <button v-for="mode in modes" :key="mode.value" :class="{ active: criteriaType === mode }"
                        @click="criteriaType = mode">
                        {{ nameOf(mode) }}
                    </button>
                </div>
            </div>
        </div>

        <div class="content-grid">
            <div class="map-container" @click="selectedCountry = null">
                <svg class="map-svg" viewBox="0 100 800 700" xmlns="http://www.w3.org/2000/svg"
                    @mousemove="onMouseMove">
                    <g v-for="country in countries" :key="country.code">
                        <path :d="country.path" :fill="rgbColor(country.props[criteriaType])"
                            :class="['country', { selected: selectedCountry && selectedCountry.code === country.code }]"
                            @click.stop="selectCountry(country)" @mouseenter="hoveredCountry = country"
                            @mouseleave="hoveredCountry = null"></path>
                    </g>
                    <foreignObject :x="20" :y="120" width="1" height="1" class="foreign-wrapper">
                        <div class="legend">
                            <span class="legend-label">{{ nameOf(criteriaType) }}</span>
                            <span v-for="limit in limits" :key="limit.value" class="legend-item"
                                :style="limit.backGround">{{ decorate(limit.value) }}</span>
                        </div>
                    </foreignObject>
                    <foreignObject v-if="tooltip.show" :x="tooltip.x" :y="tooltip.y" width="1" height="1"
                        class="foreign-wrapper">
                        <div class="custom-tooltip"
                            :style="{ transform: `translate(${tooltip.offsetX}px, ${tooltip.offsetY}px)` }">
                            <strong>{{ tooltip.name }}</strong><br />
                            {{ nameOf(criteriaType) }}: {{ decorate(tooltip.value.toLocaleString()) }}
                        </div>
                    </foreignObject>
                </svg>
            </div>

            <div class="stats-card">
                <template v-if="selectedCountry">
                    <div class="stat-header">
                        <h2 class="country-label">{{ selectedCountry.name }}</h2>
                        <img height="30" :src="selectedCountry.flag" alt="Country flag">
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Capital</span>
                        <span class="stat-value">{{ selectedCountry.capital }}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Area</span>
                        <span class="stat-value">{{ selectedCountry.props.area.toLocaleString() }} km²</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Population</span>
                        <span class="stat-value">{{ selectedCountry.props.population.toLocaleString() }}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Population Density</span>
                        <span class="stat-value">{{ selectedCountry.props.populationDensity }} p/km²</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Average Population Age</span>
                        <span class="stat-value">{{ selectedCountry.props.averagePopulationAge }} years</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Internet Speed</span>
                        <span class="stat-value">{{ selectedCountry.props.internetSpeed }} Mb/s</span>
                    </div>
                </template>
                <template v-else>
                    <h2 class="country-label">Select a Country</h2>
                    <p style="color: #d5c1e9">
                        Click on a country on the map to view detailed information
                    </p>
                </template>
            </div>
        </div>
    </div>
    <script>
        new Vue({
            el: "#app",
            data() {
                return {
                    modes: ['area', 'population', 'populationDensity', 'averagePopulationAge', 'internetSpeed'],
                    criteriaType: 'area',
                    selectedCountry: null,
                    hoveredCountry: null,
                    tooltip: {
                        show: false,
                        x: 0,
                        y: 0,
                        offsetX: -70,
                        offsetY: -60,
                        name: "",
                        value: "",
                    }
                };
            },
            watch: {
                hoveredCountry(val) {
                    this.tooltip.show = !!val;
                },
            },
            computed: {
                countries() {
                    return countries.map(country => {
                        const density = country.props.population / country.props.area;
                        country.props.populationDensity = density < 10
                            ? density < 1
                                ? density.toFixed(2)
                                : density.toFixed(1)
                            : density.toFixed();
                        return country;
                    });
                },
                totalValues() {
                    return this.countries.reduce(
                        (sum, c) => sum + c.props[this.criteriaType],
                        0
                    );
                },
                averageValues() {
                    return this.totalValues / this.countries.length;
                },
                criteriaValues() {
                    return this.countries.map(
                        (country) => country.props[this.criteriaType]
                    );
                },
                // minValue() {
                //     return Math.min(...this.props[this.criteriaType]s);
                // },
                maxValue() {
                    return Math.max(...this.criteriaValues);
                },
                limits() {
                    return [100, 10, 4, 1].map(limit => ({
                        backGround: { background: this.rgbColor(this.maxValue / limit) },
                        value: Math.round(this.maxValue / limit).toLocaleString()
                    }));
                },
            },
            methods: {
                selectCountry(country) {
                    this.selectedCountry = country;
                },
                onMouseMove(event) {
                    if (!this.hoveredCountry) return;
                    const countryMap = event.currentTarget;
                    const pt = countryMap.createSVGPoint();
                    pt.x = event.clientX;
                    pt.y = event.clientY;
                    const cursor = pt.matrixTransform(
                        countryMap.getScreenCTM().inverse()
                    );
                    this.tooltip = {
                        ...this.tooltip,
                        name: this.hoveredCountry.name,
                        value: this.hoveredCountry.props[this.criteriaType],
                        show: true,
                        x: cursor.x,
                        y: cursor.y,
                    };
                    this.hoveredCountry.code === 'SJ'
                        ? this.tooltip.offsetY = 30
                        : this.tooltip.offsetY = -60;
                },
                rgbColor(value, tonality = "blue") {
                    if (value === 0) return "rgba(0, 0, 0, 0.1)";

                    const ratio = 1 - value / this.maxValue;
                    const spectrums = {
                        blue: {
                            from: { r: 135, g: 206, b: 235 }, // sky blue
                            to: { r: 0, g: 0, b: 139 }  // dark blue
                        },
                        red: {
                            from: { r: 255, g: 182, b: 193 }, // light red
                            to: { r: 139, g: 0, b: 0 }    // dark red
                        },
                        green: {
                            from: { r: 144, g: 238, b: 144 }, // light green
                            to: { r: 0, g: 100, b: 0 }    // dark green
                        },
                        orange: {
                            from: { r: 255, g: 200, b: 120 }, // light orange
                            to: { r: 255, g: 140, b: 0 }    // dark orange
                        },
                        dark: {
                            from: { r: 200, g: 200, b: 200 }, // light gray
                            to: { r: 30, g: 30, b: 30 }   // near black
                        },
                        light: {
                            from: { r: 255, g: 255, b: 255 }, // white
                            to: { r: 180, g: 180, b: 180 }  // light gray
                        }
                    };
                    const spectrum = spectrums[tonality] || spectrums.blue;
                    const r = Math.round(spectrum.to.r + ratio * (spectrum.from.r - spectrum.to.r));
                    const g = Math.round(spectrum.to.g + ratio * (spectrum.from.g - spectrum.to.g));
                    const b = Math.round(spectrum.to.b + ratio * (spectrum.from.b - spectrum.to.b));

                    return `rgb(${r}, ${g}, ${b})`;
                },
                nameOf(criteria) {
                    switch (criteria) {
                        case 'population':
                            return 'Population';
                        case 'populationDensity':
                            return 'Pop. Density';
                        case 'area':
                            return 'Area';
                        case 'averagePopulationAge':
                            return 'Average Age';
                        case 'internetSpeed':
                            return 'Net Speed';
                        default:
                            return '';
                    }
                },
                decorate(value) {
                    switch (this.criteriaType) {
                        case 'area':
                            return `${value} km²`;
                        case 'averagePopulationAge':
                            return `${value} years`;
                        case 'internetSpeed':
                            return `${value} Mb/s`;
                        default:
                            return value;
                    }
                }
            },
        });
    </script>
</body>

</html>
